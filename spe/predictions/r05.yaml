# The headline physics prediction (R28). Real Garnet, 8-site SSH chain, bonds 1.0 and 0.3,
# one excitation on site 0, t = 2, 1000 shots, oracle circuit of 3 brick-wall Trotter steps (42 CZ).
physics_T21_real_garnet:
  question: Does the topological edge state stay visible on a real 2026 quantum computer?
  headline_call: Yes. The raw edge probability with the weak bond at the edge is 3 or more times the value with the strong bond at the edge
  ideal: {topological: 0.767, trivial: 0.142, ratio: 5.4}
  predicted:
    raw_edge_probability: {topological: [0.60, 0.08], trivial: [0.15, 0.06]}
    postselected_edge_probability: {topological: [0.72, 0.07], trivial: [0.15, 0.06]}
    one_excitation_share: {topological: [0.70, 0.10], trivial: [0.70, 0.10]}
    raw_ratio_topological_over_trivial: at least 3
  baselines:
    noise_model: IQMFakeGarnet on the oracle circuit. Computed after this file is committed, before the real probe
    no_noise: the ideal values
  why: About 42 CZ at roughly 99.5 percent fidelity leaves about 80 percent of the signal. Decay pulls the excitation out of the chain, so the one-excitation share falls and post-selection recovers most of the edge weight. The trivial value sits near 1/8, where noise has little to move.
  applies_to: the setup probe and every agent T21 real job that uses 8 sites, t = 2, and 1000 shots

