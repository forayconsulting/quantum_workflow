# The headline physics prediction (R32). Real Emerald, all 54 qubits, every one of the 85 couplers.
# One step = RX(theta) on every qubit, then RZZ(-pi/2) on every coupler in 4 layers.
# 3 steps (255 CZ), start in all zeros, 4 circuits (theta = 0, 0.2 pi, 0.35 pi, 0.5 pi), 250 shots each.
# Quantity = mean of <Z> over the 54 qubits. "exact" = light-cone value of the model circuit.
physics_real_emerald:
  question: Does a 54-qubit, 255-CZ circuit on real Emerald still carry the right physics?
  headline_call: Yes. After dividing by the theta = 0 value, mean <Z> at theta = 0.2 pi and 0.35 pi lands within 0.10 of exact
  predicted:
    raw_mean_z_theta_0: [0.92, 0.04]
    raw_over_exact_theta_0.2pi: [0.75, 0.12]
    raw_over_exact_theta_0.35pi: [0.75, 0.12]
    rescaled_minus_exact_theta_0.2pi: [0.00, 0.10]
    rescaled_minus_exact_theta_0.35pi: [0.00, 0.10]
    raw_minus_exact_theta_0.5pi: [0.00, 0.10]
    billed_seconds_per_job: [1.5, 0.5]
  why:
    raw_mean_z_theta_0: The state stays all zeros and CZ on zeros does almost nothing, so readout error of 2 to 3 percent per qubit dominates.
    raw_over_exact: Each qubit sits in about 11 CZs of about 99.5 percent fidelity, plus readout.
    rescaled: Rescaling removes readout and most CZ decay. It over-corrects slightly, because entangled states decay faster than all zeros.
    theta_0.5pi: The ideal value is near 0 at the Clifford point, and noise also pulls toward 0.
    billed_seconds: Garnet billed 1.0 second for 2 circuits of 1000 shots. This job has 1000 shots in total.
  baselines:
    calibration_product: per qubit, exact times the product of IRB CZ fidelities in its light cone times (1 - 2 x readout error), from Emerald's live calibration. Computed after this file is committed, before the probe
    no_noise: the exact values
  applies_to: the setup probe and every agent T23 real job with this circuit shape
  checks: grade.py cone_mean_z on the payload, mean_z from API counts, rescaled from counts, metrics.billed_seconds

